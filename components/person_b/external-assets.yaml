# External assets of Person B. None of them is committed or copied into the Docker image; they are
# mounted below the sibling `reference/` directory (compose: ../../reference -> /reference:ro).
#
# Digest algorithms (the runtime recomputes the model and knowledge-base digests before every query
# and fails on a mismatch; see components/person_b/dense.py):
#   files_sha256(root, names) = sha256 over, for each name in sorted order, the text
#                               "<name>\0<sha256 of the file>\n"
#   directory_sha256(root)    = files_sha256 over every file below root (relative posix paths)
#
# The A.Literature artifact (run/input/pipeline/A_literature.json) is derived from the corpus asset
# by `prepare_literature` and is not an external asset: regenerate it, do not copy it.
assets:
  - asset_id: rag-database-who-breast-tumours-5e
    type: corpus_snapshot
    required: true
    version: "rag_database@1"
    revision: "sha256-ffd76f0893866aad7b2dd0f71bce76c90d1de8faf245eb2414a500637c01bc30"
    sha256: "ffd76f0893866aad7b2dd0f71bce76c90d1de8faf245eb2414a500637c01bc30"
    size_bytes: 1062669
    logical_path: "reference/person_b/checkpoint/rag_database"
    configured_by: "run prepare_literature with --source <logical_path> and configs/prepare_literature.rag_database.json"
    license_or_access_policy: "UNCONFIRMED. Text of the WHO Classification of Tumours, Breast Tumours (5th ed.); redistribution terms have not been verified by the component owner. Treat as restricted: do not republish; share only through the project's access-controlled reference storage until the owner confirms the terms."
    contains_phi: false
    depends_on: []
    content:
      format: "one <disease>.json per disease: {disease_name, sections[{section_type, page_content}], images}; images are ignored"
      json_files: 87
      sections: 1349
      literal_none_sections: 93
      indexed_sections: 1256
      skipped_files: "18 empty files without a .json extension (chapter placeholders, 0 bytes each)"
    verification:
      algorithm: "sha256 over, for each *.json file in file-name string order, '<file name>\\0<raw bytes>\\0' (build_literature_artifact_from_rag_database)"
      check: "prepare_literature writes this value as payload.corpus.sha256 of A.Literature"
    notes: "Provenance of the export itself (who scraped it, when, from where) is not recorded in the repository and must be supplied by the corpus owner."

